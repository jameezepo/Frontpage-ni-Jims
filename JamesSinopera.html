<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Shot, No Kill</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1923; /* Dark tactical theme */
            color: #ece8e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .card {
            background-color: #1f2326;
            border: 2px solid #ff4655; /* Vibrant accent color */
            border-radius: 8px;
            padding: 3rem 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            color: #ff4655;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.1rem;
            color: #8b978f;
            font-weight: 400;
            font-style: italic;
            margin-bottom: 2rem;
        }

        .author {
            font-size: 0.9rem;
            color: #ece8e1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-top: 1px solid #333;
            padding-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>One Shot, No Kill</h1>
        <h2>"I can shoot, but cant hit"</h2>
        <div class="author">Created by James Michael Sinopera</div>
    </div>

</body>
</html>
